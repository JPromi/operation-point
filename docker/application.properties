spring.application.name=operation-point

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:operation_point}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.thymeleaf.extras.spring-security.enabled=true
server.forward-headers-strategy=native

# JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Swagger Settings
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

# Variables for the application
com.jpromi.operation_point.crawler.tyrol.token=${CRAWLER_TYROL_TOKEN:}
com.jpromi.operation_point.domain=${APP_DOMAIN:http://localhost:8080}
com.jpromi.operation_point.file.storage.path=/app/data/files

# Server
server.address=0.0.0.0
server.port=8080
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:32GB}
spring.servlet.multipart.max-request-size=${MAX_FILE_SIZE:32GB}

# Tomcat Settings
server.tomcat.max-part-count=-1
